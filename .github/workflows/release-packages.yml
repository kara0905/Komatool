name: Build and release KomaTool packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install NSIS
        run: choco install nsis --yes --no-progress

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Check updater signing key
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "Ajoutez TAURI_SIGNING_PRIVATE_KEY dans les secrets du dépôt GitHub."
          }

      - name: Verify release tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($version -ne $tauriVersion) {
            throw "package.json ($version) et src-tauri/tauri.conf.json ($tauriVersion) doivent avoir la même version."
          }
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Le tag doit correspondre à la version de package.json (v$version)."
          }

      - name: Build installer
        run: bun run tauri:build:windows

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: KomaTool-Windows-Installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-22.04
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev libfuse2 \
            libssl-dev libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev patchelf \
            unzip wget

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Check updater signing key
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY" || (echo "Ajoutez TAURI_SIGNING_PRIVATE_KEY dans les secrets du dépôt GitHub." && exit 1)

      - name: Build Linux packages
        run: bun run tauri:build:linux

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: KomaTool-Linux-Packages
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust with macOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Check updater signing key
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY" || (echo "Ajoutez TAURI_SIGNING_PRIVATE_KEY dans les secrets du dépôt GitHub." && exit 1)

      - name: Build universal macOS disk image
        run: bun run tauri:build:macos

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: KomaTool-macOS-Package
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: KomaTool-*-*
          merge-multiple: true

      - name: Create signed updater manifest
        run: node scripts/create-updater-manifest.mjs release-assets "${GITHUB_REF_NAME}" "${GITHUB_REPOSITORY}"

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${GITHUB_REF_NAME}" \
            --jq .body > release-notes.md

      - name: Publish packages on GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: KomaTool ${{ github.ref_name }}
          body_path: release-notes.md
          files: release-assets/publish/*
