[package]
name = "komatool"
version = "1.1.5"
description = "Outil multiplateforme de fusion et découpe d'images"
edition = "2021"

[lib]
name = "komatool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
crc32fast = "1.5"
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "webp",
  "gif",
  "bmp",
  "tiff",
] }
thiserror = "2"
rayon = "1.10"
memmap2 = "0.9.12"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
